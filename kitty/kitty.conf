font_family      JetBrainsMono Nerd Font
font_size        12.0
bold_font        auto
italic_font      auto
bold_italic_font auto

# Isso habilita o suporte total a cores (True Color)
term xterm-256color

# ── Barra no rodapé, no mesmo estilo do p10k (desenhada por tab_bar.py) ──
# Abas à esquerda; cpu/ram/gpu/disco à direita, atualizados a cada 2s.
tab_bar_edge          bottom
tab_bar_style         custom
tab_bar_min_tabs      1

# ── Painel lateral do superfile ──
# splits: permite abrir o painel à esquerda; stack: "zoom" numa janela só
enabled_layouts       splits,stack
# controle remoto só pelo socket local (o painel usa para abrir/fechar)
allow_remote_control  socket-only
listen_on             unix:/tmp/kitty-{kitty_pid}

# cmd+e: abre/fecha a árvore ao lado do terminal atual
map cmd+e       launch --type=background --allow-remote-control --cwd=current /bin/sh /Users/zanvetor/.config/kitty/sfpanel.sh toggle @active-kitty-window-id
# cmd+shift+e: alterna o foco entre a árvore e o terminal
map cmd+shift+e nth_window -1
# cmd+j: vai para a árvore navegar (w/s/a/d, enter abre, esc volta) e de volta
map cmd+j       launch --type=background --allow-remote-control --cwd=current /bin/sh /Users/zanvetor/.config/kitty/sfpanel.sh jump @active-kitty-window-id
